<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found | Veratype</title>
  <meta name="theme-color" content="#0a1628" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--ink:#0B1220;--ink-soft:#1C2A42;--paper:#FAFBFD;--pulse:#2563FF;--pulse-deep:#1D4FD8;--line:#DCE2EE;--line-dark:rgba(255,255,255,0.10);--mono-dim:#6B7690}
    body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--paper);color:var(--ink);line-height:1.6}
    :focus-visible{outline:2px solid var(--pulse);outline-offset:2px}
    nav{display:flex;align-items:center;justify-content:space-between;padding:0 48px;height:68px;background:rgba(250,251,253,0.85);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
    .nav-logo{font-family:'Bricolage Grotesque',sans-serif;font-size:22px;font-weight:800;color:var(--ink);text-decoration:none;letter-spacing:-0.02em}
    .nav-logo span{color:var(--pulse)}
    .hero{background:var(--ink);padding:100px 24px;text-align:center}
    .hero h1{font-family:'Bricolage Grotesque',sans-serif;font-size:clamp(32px,5vw,56px);font-weight:800;color:#fff;letter-spacing:-0.02em;margin-bottom:16px}
    .hero p{color:var(--mono-dim);font-size:17px;margin-bottom:32px}
    .hero a{display:inline-block;padding:14px 28px;background:var(--pulse);border-radius:8px;color:#fff;font-size:15px;font-weight:600;text-decoration:none;transition:background 0.15s,transform 0.15s}
    .hero a:hover{background:var(--pulse-deep);transform:translateY(-1px)}
    footer{background:var(--ink);border-top:1px solid var(--line-dark);padding:32px 48px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
    .footer-logo{font-family:'Bricolage Grotesque',sans-serif;font-size:18px;font-weight:800;color:#fff;letter-spacing:-0.02em}
    .footer-logo span{color:var(--pulse)}
    .footer-copy{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.04em;color:var(--mono-dim)}
  </style>
</head>
<body>
  <nav>
    <a href="/" class="nav-logo">Vera<span>type</span></a>
  </nav>
  <div class="hero">
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or has been moved.</p>
    <a href="/">Back to home</a>
  </div>
  <footer>
    <span class="footer-logo">Vera<span>type</span></span>
    <span class="footer-copy">&copy; 2026 Veratype. All rights reserved.</span>
  </footer>
  <!-- Cloudflare Web Analytics — replace BEACON_TOKEN with your token from the Cloudflare dashboard -->
  <!-- <script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "BEACON_TOKEN"}'></script> -->
</body>
</html>
