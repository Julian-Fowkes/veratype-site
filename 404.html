<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found | Veratype</title>
  <meta name="theme-color" content="#0a1628" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--navy:#0a1628;--blue:#0056d6;--blue-hover:#0044b0;--gray-200:#e2e6ee;--gray-600:#5a6478;--white:#ffffff}
    body{font-family:'Inter',sans-serif;background:var(--white);color:#1a2236;line-height:1.6}
    nav{display:flex;align-items:center;justify-content:space-between;padding:0 48px;height:68px;background:var(--white);border-bottom:1px solid var(--gray-200)}
    .nav-logo{font-size:22px;font-weight:900;color:var(--navy);text-decoration:none;letter-spacing:-0.5px}
    .nav-logo span{color:var(--blue)}
    .hero{background:var(--navy);padding:100px 24px;text-align:center}
    .hero h1{font-size:clamp(32px,5vw,56px);font-weight:900;color:#fff;letter-spacing:-1.5px;margin-bottom:16px}
    .hero p{color:#94a3b8;font-size:18px;margin-bottom:32px}
    .hero a{display:inline-block;padding:14px 28px;background:var(--blue);border-radius:6px;color:#fff;font-size:15px;font-weight:700;text-decoration:none;transition:background 0.15s}
    .hero a:hover{background:var(--blue-hover)}
    footer{background:var(--navy);border-top:1px solid rgba(255,255,255,0.06);padding:32px 48px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
    .footer-logo{font-size:18px;font-weight:900;color:#fff;letter-spacing:-0.3px}
    .footer-logo span{color:#60a5fa}
    .footer-copy{font-size:13px;color:#475569}
  </style>
</head>
<body>
  <nav>
    <a href="/" class="nav-logo">Vera<span>type</span></a>
  </nav>
  <div class="hero">
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or has been moved.</p>
    <a href="/">Back to home</a>
  </div>
  <footer>
    <span class="footer-logo">Vera<span>type</span></span>
    <span class="footer-copy">&copy; 2026 Veratype. All rights reserved.</span>
  </footer>
  <!-- Cloudflare Web Analytics — replace BEACON_TOKEN with your token from the Cloudflare dashboard -->
  <!-- <script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "BEACON_TOKEN"}'></script> -->
</body>
</html>
